[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "celestial-crm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy[asyncio]==2.0.41",
  "asyncpg==0.30.0",
  "aiosqlite==0.21.0",
  "alembic==1.16.4",
  "pydantic-settings==2.10.1",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.0.1",
  "cryptography==45.0.5",
  "httpx[socks]==0.28.1",
  # Браузерные сессии для токена EAAB: токен берётся из живого браузера с
  # cookies и прокси аккаунта — единственный способ не спалить сессию.
  # >=1.52: greenlet>=3.1.1, у которого есть колёса под свежие Python.
  "playwright==1.52.0",
  "playwright-stealth==1.0.6",
  "celery[redis]==5.5.3",
  "redis==5.2.1",
  "python-multipart==0.0.20",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
# Переиспользованная фикстура: pytest требует, чтобы её имя было и в импорте, и
# в аргументе теста, и ruff видит в этом переопределение.
"tests/test_meta_bundle.py" = ["F811"]
