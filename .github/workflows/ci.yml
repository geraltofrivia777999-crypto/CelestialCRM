name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Часть эндпоинтов ставит задание в очередь Celery, и без брокера такой
    # запрос падает прямо в тесте. База тестам не нужна — они на SQLite.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest --cov=app

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f frontend/Dockerfile .

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      # Сеть общая с сервисом рекрутинга: в docker-compose она объявлена
      # внешней и на сервере заводится один раз руками.
      - run: docker network create recruitmentservice_internal
      - run: docker compose up --build -d
      - run: |
          for attempt in $(seq 1 60); do
            curl --fail http://localhost:8080/api/health && exit 0
            sleep 2
          done
          exit 1
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
      - if: always()
        run: docker network rm recruitmentservice_internal || true
