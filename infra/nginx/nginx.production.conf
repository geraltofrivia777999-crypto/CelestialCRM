# Only Cloudflare's published networks may supply the visitor's real IP.
# Source: https://www.cloudflare.com/ips/ (verified 2026-09-04).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Check the original TCP peer, not the rewritten visitor IP.
geo $realip_remote_addr $crm_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# Compatibility while the owner switches Cloudflare to Full (strict).
# Direct HTTP clients cannot spoof this using X-Forwarded-Proto or CF headers.
# This does NOT encrypt the Cloudflare-to-origin hop in Flexible mode.
map "$scheme:$crm_cloudflare:$http_x_forwarded_proto" $crm_https {
    default 0;
    ~^https: 1;
    "http:1:https" 1;
}
map $crm_https $crm_forwarded_scheme {
    default http;
    1 https;
}
map "$crm_https:$uri" $crm_redirect_https {
    default 1;
    ~^1: 0;
    ~^0:/\.well-known/acme-challenge/ 0;
}

limit_req_zone $binary_remote_addr zone=crm_login:10m rate=10r/m;

server {
    listen 80;
    listen 443 ssl;
    server_name celestialgroup.fit;
    ssl_certificate /etc/letsencrypt/live/celestialgroup.fit/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/celestialgroup.fit/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CRM_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 100m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server_tokens off;

    if ($crm_redirect_https) { return 308 https://celestialgroup.fit$request_uri; }
    if ($host != celestialgroup.fit) { return 308 https://celestialgroup.fit$request_uri; }

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ ^/api/v1/auth/login/?$ {
        limit_req zone=crm_login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @crm_login_limited;
        client_max_body_size 8k;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $crm_forwarded_scheme;
    }

    location @crm_login_limited {
        default_type application/json;
        add_header Retry-After 6 always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        return 429 '{"error":{"code":"rate_limited","message":"Too many login attempts. Try again shortly.","details":{}}}';
    }

    # Existing production routes are preserved; their services are unchanged.
    location = /providers/hh/callback {
        set $recruitment_upstream http://recruitment-api:8000;
        proxy_pass $recruitment_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $crm_forwarded_scheme;
    }

    location = /telegram/applications {
        set $recruitment_upstream http://recruitment-api:8000;
        proxy_pass $recruitment_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $crm_forwarded_scheme;
    }

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $crm_forwarded_scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
    }
}
