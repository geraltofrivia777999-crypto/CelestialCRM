# Client IP comes from the TCP connection, not a spoofable forwarded header.
# This shared zone covers every nginx worker and both login URL variants.
limit_req_zone $binary_remote_addr zone=crm_login:10m rate=10r/m;

server {
    listen 80;
    client_max_body_size 100m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/api/v1/auth/login/?$ {
        limit_req zone=crm_login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @crm_login_limited;
        client_max_body_size 8k;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @crm_login_limited {
        default_type application/json;
        add_header Retry-After 6 always;
        return 429 '{"error":{"code":"rate_limited","message":"Too many login attempts. Try again shortly.","details":{}}}';
    }

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Браузерные сессии (запуск, извлечение EAAB с повторами навигации)
        # длятся десятки секунд — дефолтные 60с резали бы их на полпути.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
    }
}
