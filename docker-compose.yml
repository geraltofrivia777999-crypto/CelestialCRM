services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: celestial
      POSTGRES_USER: celestial
      POSTGRES_PASSWORD: celestial
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U celestial -d celestial"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    command: >
      sh -c "Xvfb :99 -screen 0 1366x768x24 & sleep 1 &&
             x11vnc -forever -shared -display :99 -nopw -bg &
             alembic upgrade head &&
             python -m app.seed &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      # VNC без пароля доступен только локально: с VPS к нему подключаются через
      # SSH-туннель, а наружный порт позволил бы управлять сессией кому угодно.
      - "127.0.0.1:5900:5900"
    volumes:
      # Вложения базы знаний (ТЗ 8.2) живут на диске. Без тома они исчезнут при
      # первом же пересоздании контейнера, а статьи останутся с битыми ссылками.
      - uploads_data:/app/uploads
      # Браузерные сессии Meta Ads: сохранённый storage_state используется для
      # автообновления EAAB-токена, и он должен переживать пересоздание контейнера.
      - meta_sessions_data:/app/meta_sessions
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - default
      # Сервис рекрутинга («Рекрутинг») живёт в соседней compose-сети той же
      # VPS: без этого CRM-бэкенд не достучится до http://recruitment-api:8000.
      # Локально сеть создаётся один раз: docker network create recruitmentservice_internal
      - recruitment

  worker:
    build: ./backend
    env_file: .env
    command: >
      sh -c "Xvfb :99 -screen 0 1366x768x24 & sleep 1 &&
             exec celery -A app.workers.celery_app worker --loglevel=INFO"
    volumes:
      # Токен сессии (EAAB) обновляется синхронизацией через восстановление
      # браузерной сессии — worker тоже должен видеть сохранённые сессии.
      - meta_sessions_data:/app/meta_sessions
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build: ./backend
    env_file: .env
    command: celery -A app.workers.celery_app beat --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  meta_sessions_data:

networks:
  recruitment:
    external: true
    name: recruitmentservice_internal
