<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Вход — Celestial CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5f9;color:#1f2231;font-family:Inter,sans-serif}
    body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 15% 15%,rgba(90,95,224,.13),transparent 32%),radial-gradient(circle at 85% 85%,rgba(125,103,237,.10),transparent 35%);pointer-events:none}
    .card{position:relative;width:min(430px,calc(100vw - 32px));padding:38px;background:#fff;border:1px solid #e8eaf1;border-radius:22px;box-shadow:0 24px 70px rgba(31,34,49,.12)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:34px}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#5a5fe0,#836dec);color:#fff;font:700 19px "Space Grotesk"}
    .brand strong,h1{font-family:"Space Grotesk",sans-serif}.brand strong{font-size:17px}h1{font-size:28px;letter-spacing:-.7px;margin:0}.sub{color:#9298a9;font-size:13px;margin:8px 0 28px}
    label{display:block;margin:0 0 17px}.label{display:block;font-size:11.5px;font-weight:700;color:#707687;margin-bottom:8px}
    input{width:100%;height:48px;border:1px solid #dfe2eb;border-radius:11px;padding:0 14px;font:500 13px Inter;outline:0;transition:.2s}input:focus{border-color:#5a5fe0;box-shadow:0 0 0 3px rgba(90,95,224,.1)}
    button{width:100%;height:48px;border:0;border-radius:11px;background:#5a5fe0;color:#fff;font:700 13px Inter;cursor:pointer;margin-top:5px;box-shadow:0 10px 22px rgba(90,95,224,.22)}button:disabled{opacity:.65;cursor:wait}
    .error{min-height:18px;margin-top:14px;color:#d94b61;font-size:12px;text-align:center}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark">C</span><strong>Celestial CRM</strong></div>
    <h1>С возвращением</h1>
    <p class="sub">Войдите, чтобы открыть рабочее пространство</p>
    <form id="loginForm">
      <label><span class="label">Логин</span><input id="login" autocomplete="username" required autofocus></label>
      <label><span class="label">Пароль</span><input id="password" type="password" autocomplete="current-password" required></label>
      <button id="submit" type="submit">Войти</button>
      <div id="error" class="error" role="alert"></div>
    </form>
  </main>
  <script src="/api.js"></script>
  <script>
    (function () {
      var form = document.getElementById("loginForm");
      var button = document.getElementById("submit");
      var error = document.getElementById("error");
      CelestialAPI.get("/auth/me").then(function () {
        window.location.replace(new URLSearchParams(location.search).get("next") || "/");
      }).catch(function () {});
      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        error.textContent = "";
        button.disabled = true;
        button.textContent = "Вхожу…";
        try {
          await CelestialAPI.post("/auth/login", {
            login: document.getElementById("login").value,
            password: document.getElementById("password").value
          });
          window.location.replace(new URLSearchParams(location.search).get("next") || "/");
        } catch (exception) {
          error.textContent = exception.status === 401
            ? "Неверный логин или пароль"
            : exception.message;
        } finally {
          button.disabled = false;
          button.textContent = "Войти";
        }
      });
    })();
  </script>
</body>
</html>
