server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The pages and their scripts are unversioned, so browsers must revalidate on every
  # load. Without this they apply heuristic caching and keep running stale JS after a
  # deploy.
  location ~* \.(html|js)$ {
    add_header Cache-Control "no-cache";
  }
}
