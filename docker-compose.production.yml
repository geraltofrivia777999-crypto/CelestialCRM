x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    logging: *default-logging

  redis:
    restart: unless-stopped
    logging: *default-logging

  api:
    restart: unless-stopped
    logging: *default-logging

  worker:
    restart: unless-stopped
    logging: *default-logging

  keitaro-worker:
    restart: unless-stopped
    logging: *default-logging

  meta-worker:
    restart: unless-stopped
    logging: *default-logging

  scheduler:
    restart: unless-stopped
    logging: *default-logging

  frontend:
    restart: unless-stopped
    logging: *default-logging

  nginx:
    restart: unless-stopped
    logging: *default-logging
    # TLS живёт здесь, а не только в tls-оверлее: деплой с явными -f без
    # оверлея иначе терял биндинг 443, и Cloudflare отдавал 521.
    ports:
      - "443:443"
    volumes:
      - ${CRM_NGINX_CONFIG:-./infra/nginx/nginx.production.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./infra/tls/letsencrypt:/etc/letsencrypt:ro
      - ./infra/tls/webroot:/var/www/certbot:ro
